_BASE_: ../base-finetune.yaml

DATA:
  NAME: "OxfordFlowers"
  DATAPATH: "/content/data/flowers-102"   # change if your path is different
  NUMBER_CLASSES: 102
  MULTILABEL: False

MODEL:
  TYPE: "vit"
  TRANSFER_TYPE: "adapter"    # use ADPT_VisionTransformer / adapter path
  ADAPTER:
    STYLE: "Pfeiffer"
    REDUCATION_FACTOR: 16     # dim // 16, matches your ADPT_Block

    # ---- HCC-specific knobs (must match config.py & HCCTokenAdapter) ----
    NAME: "HCC"
    HCC:
      # DT1D / finite weighted h-Hartley--cosine proposal settings
      M: 1
      H: 1
      AXIS: "hw"
      DILATIONS: "1,2,4"
      SCALE_ADAPTIVE: True
      SEPARATE_AXIS_KERNELS: True
      GATE_TEMPERATURE: 1.0
      INPUT_ADAPTIVE_GATE: False   # static/global gates, not sample-adaptive router
      ALPHA_GROUP: 16
      PER_CHANNEL: False           # True forces one alpha group per channel
      TIE_SYM: True
      NO_PW: True                  # ultra-light mode
      USE_PW: False                # legacy inverse of NO_PW
      PW_RATIO: 32
      PW_GROUPS: 4
      USE_BN: False
      RESIDUAL_SCALE: 1.0
      GATE_INIT: 0.0               # identity-safe initialization
      PADDING: "reflect"

SOLVER:
  TOTAL_EPOCH: 10
  BASE_LR: 5.0e-3             # slightly higher is common for adapters
  WEIGHT_DECAY: 0.0001
  OPTIMIZER: "adamw"
  SCHEDULER: "cosine"
  WARMUP_EPOCH: 5
  LOG_EVERY_N: 10

RUN_N_TIMES: 1
