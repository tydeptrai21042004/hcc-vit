_BASE_: ../base-finetune.yaml

DATA:
  NAME: "OxfordFlowers"
  DATAPATH: "/content/data/oxford-flowers102"   # same path as above
  NUMBER_CLASSES: 102
  MULTILABEL: False

MODEL:
  TYPE: "vit"
  TRANSFER_TYPE: "adapter"   # use ADPT_VisionTransformer / adapter path
  ADAPTER:
    STYLE: "Pfeiffer"
    REDUCATION_FACTOR: 16    # bottleneck size: dim // 16, matches your ADPT_Block

    # ---- HCC-specific knobs (must match your added config fields) ----
    NAME: "HCC"
    HCC:
      M: 1
      H: 1
      AXIS: "h"              # "h" | "w" | "hw"
      PER_CHANNEL: True
      TIE_SYM: True
      USE_PW: False          # ultra-light HCC, no 1x1 PW mixing
      PW_RATIO: 8
      USE_BN: True
      RESIDUAL_SCALE: 1.0
      GATE_INIT: 0.1
      PADDING: "reflect"

SOLVER:
  TOTAL_EPOCH: 10
  BASE_LR: 5.0e-3            # usually a bit higher for adapters
  WEIGHT_DECAY: 0.0001

RUN_N_TIMES: 1
