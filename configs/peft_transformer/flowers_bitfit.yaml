_BASE_: ../base-finetune.yaml
OUTPUT_DIR: outputs/peft_transformer/bitfit
DATA:
  NAME: OxfordFlowers
  DATAPATH: /path/to/flowers-102
  FEATURE: sup_vitb16_224
  NUMBER_CLASSES: 102
  BATCH_SIZE: 64
  NUM_WORKERS: 4
MODEL:
  TYPE: vit
  TRANSFER_TYPE: tinytl-bias
SOLVER:
  TOTAL_EPOCH: 50
  BASE_LR: 1.0e-3
  WEIGHT_DECAY: 0.0
  OPTIMIZER: adamw
  LOG_EVERY_N: 10
