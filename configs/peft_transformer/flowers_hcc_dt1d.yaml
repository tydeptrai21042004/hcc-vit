_BASE_: ../base-finetune.yaml
OUTPUT_DIR: outputs/peft_transformer/hcc_dt1d
DATA:
  NAME: OxfordFlowers
  DATAPATH: /path/to/flowers-102
  FEATURE: sup_vitb16_224
  NUMBER_CLASSES: 102
  BATCH_SIZE: 64
  NUM_WORKERS: 4
MODEL:
  TYPE: vit
  TRANSFER_TYPE: adapter
  ADAPTER:
    NAME: HCC
    HCC:
      M: 2
      H: 1
      AXIS: hw
      PER_CHANNEL: null
      ALPHA_GROUP: 16
      TIE_SYM: True
      USE_PW: null
      NO_PW: True
      PW_RATIO: 32
      PW_GROUPS: 4
      USE_BN: False
      RESIDUAL_SCALE: 1.0
      GATE_INIT: 0.0
      PADDING: reflect
SOLVER:
  TOTAL_EPOCH: 50
  BASE_LR: 5.0e-4
  WEIGHT_DECAY: 1.0e-4
  OPTIMIZER: adamw
  LOG_EVERY_N: 10
